# Bound to the house LAN or wg0 by the host agent. IPv4 only.
interface=wg0
bind-interfaces
dhcp-range=10.77.0.50,10.77.0.200,12h
dhcp-option=option:router,10.77.0.1
dhcp-option=option:dns-server,10.77.0.1
dhcp-option=option:ntp-server,10.77.0.1
domain=min
no-resolv
server=/min/127.0.0.1
port=0
log-dhcp
