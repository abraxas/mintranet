server:
  interface: 0.0.0.0
  access-control: 10.77.0.0/24 allow
  access-control: 172.30.77.0/24 allow
  hide-identity: yes
  hide-version: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  use-caps-for-id: no
  prefetch: yes
  do-ip6: no
  private-address: 10.77.0.0/24
stub-zone:
  name: "min"
  stub-addr: 172.30.77.13
forward-zone:
  name: "."
  forward-addr: 10.77.0.1
